services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: cheatsheet_db
      POSTGRES_USER: cheatsheet_user
      POSTGRES_PASSWORD: cheatsheet_pass
    # Database stays internal to Compose for local development.
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.docker
    environment:
      - DATABASE_URL=postgres://cheatsheet_user:cheatsheet_pass@db:5432/cheatsheet_db
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,backend
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - COMPILER_BACKEND=sidecar
      - COMPILER_SIDECAR_SOCKET=/run/texgen/compiler.sock
    volumes:
      - ./backend:/app
      - compiler_socket:/run/texgen
    group_add: ["10001"]
    depends_on:
      db:
        condition: service_started
      compiler:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 10
  compiler:
    restart: "on-failure:3"
    build:
      context: ./backend
      dockerfile: compiler_sidecar/Dockerfile
    network_mode: none
    read_only: true
    tmpfs:
      - /work:rw,noexec,nosuid,nodev,size=64m,mode=700,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.50"
    volumes:
      - compiler_socket:/run/texgen
    healthcheck:
      test: ["CMD", "python", "-S", "-m", "compiler_sidecar.container.healthcheck", "/run/texgen/compiler.sock"]
      interval: 30s
      timeout: 45s
      retries: 3
      start_period: 20s
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Vite uses this from inside the container to proxy browser /api calls to Django.
      - VITE_API_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  frontend_node_modules:
  compiler_socket:
