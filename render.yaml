services:
  - type: web
    name: texgen-api
    runtime: docker
    plan: starter
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health/
    preDeployCommand: python manage.py migrate
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: texgen-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: texgen-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://texgen-web.onrender.com
      - key: YOUTUBE_API_KEY
        sync: false

  - type: web
    name: texgen-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://texgen-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' blob: https://texgen-api.onrender.com; img-src 'self' data: blob: https://img.youtube.com https://i.ytimg.com; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; frame-src https://www.youtube.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"

databases:
  - name: texgen-db
    plan: basic-256mb
    databaseName: cheatsheet_db
    user: cheatsheet_user
    ipAllowList: []
