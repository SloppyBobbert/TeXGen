name: CI

on:
  push:
    branches: ["main", "tests"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957
        env:
          POSTGRES_DB: backend_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-bootstrap.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --only-binary=:all: --no-deps --require-hashes -r requirements-bootstrap.txt
          .venv/bin/python -m pip install -r requirements.txt -c requirements.lock
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint Python
        run: ruff check .

      - name: Security audit
        run: python -m pip_audit --local

      - name: Run tests
        env:
          DATABASE_URL: postgres://user:password@localhost:5432/backend_db
        run: pytest -v --cov-fail-under=95

      - name: Check migration drift
        env:
          DATABASE_URL: postgres://user:password@localhost:5432/backend_db
        run: python manage.py makemigrations --check --dry-run

      - name: Run PostgreSQL quota concurrency evidence
        env:
          DATABASE_URL: postgres://user:password@localhost:5432/backend_db
          TEXGEN_REQUIRE_POSTGRES_CONCURRENCY: "1"
        run: pytest --no-cov -v tests/test_compile_quota_postgres.py tests/test_request_throttle_postgres.py api/test_guest_balance.py::test_postgresql_atomic_reservations_never_exceed_three

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Security audit
        run: npm audit --audit-level=low

      - name: Run tests
        run: npm test -- --run

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Build
        run: npm run build

  browser-e2e:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pi/playwright-browsers
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: ./frontend
        run: npm ci --ignore-scripts

      - name: Install Chromium
        working-directory: ./frontend
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Stage verified ARM64 compiler assets
        run: |
          test "$(uname -m)" = aarch64
          archive="$RUNNER_TEMP/texgen-compiler-assets.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 120 --retry 3 --max-filesize 25255835 \
            --output "$archive" \
            https://github.com/SloppyBobbert/TeXGen/releases/download/compiler-assets-0.15.0-238864f4e9df/texgen-compiler-assets-0.15.0-corpus-238864f4e9df.tar.gz
          printf '%s  %s\n' add28e26a3af62f800b8171070501bf1ecb4f5b0f79244c5f14b11023fe9bce3 "$archive" | sha256sum --check --strict
          mkdir backend/.compiler-assets
          tar --extract --gzip --file "$archive" --directory backend/.compiler-assets --no-same-owner
          python3 -S backend/compiler_sidecar/container/verify_assets.py backend/.compiler-assets

      - name: Validate the supported development topology after asset verification
        run: docker compose -f docker-compose.yml config --quiet

      - name: Prepare disposable production fixtures and images
        run: |
          umask 077
          mkdir -p .pi
          python3 - <<'PY'
          import os, secrets
          from pathlib import Path
          project = f"texgen-e01s03-ci-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          password = secrets.token_hex(24)
          values = {
              'DJANGO_SECRET_KEY': secrets.token_urlsafe(48),
              'JWT_SIGNING_KEY': secrets.token_urlsafe(48),
              'POSTGRES_PASSWORD': secrets.token_hex(24),
              'POSTGRES_APP_PASSWORD': password,
              'DATABASE_URL': f'postgres://texgen:{password}@db:5432/texgen',
              'DJANGO_ALLOWED_HOSTS': 'localhost,127.0.0.1',
              'TEXGEN_LOCAL_HTTP': '1',
              'TEXGEN_HTTP_PORT': '5173',
              'TEXGEN_BACKEND_IMAGE': 'texgen-e01s03-backend:test',
              'TEXGEN_FRONTEND_IMAGE': 'texgen-e01s03-frontend:test',
              'TEXGEN_COMPILER_IMAGE': 'texgen-e01s03-compiler:test',
          }
          Path('.pi/production-test.project').write_text(project + '\n')
          Path('.pi/production-test.env').write_text(''.join(f'{key}={value}\n' for key, value in values.items()))
          PY
          docker pull postgres@sha256:6eb0add3b77c081df18aa518ce43df58fdcc40f2e6d868a6fd08038dc7acd425
          docker build --target production -t texgen-e01s03-backend:test backend
          docker build --target production -t texgen-e01s03-frontend:test frontend
          docker build -f backend/compiler_sidecar/Dockerfile -t texgen-e01s03-compiler:test backend

      - name: Verify production runtime and all browser journeys without downloads
        run: bash scripts/verify-production.sh

      - name: Verify optional public TLS on owned loopback containers
        run: python3 scripts/check-public-https.py

      - name: Show stack logs on failure
        if: failure()
        run: |
          if test -s .pi/production-test.project && test -s .pi/production-test.env; then
            docker compose --env-file .pi/production-test.env -p "$(<.pi/production-test.project)" -f docker-compose.production.yml logs --tail=100
          fi

      - name: Tear down the owned test stack
        if: always()
        run: |
          if test -s .pi/production-test.project && test -s .pi/production-test.env; then
            project=$(<.pi/production-test.project)
            [[ "$project" == texgen-e01s03-ci-* ]]
            docker compose --env-file .pi/production-test.env -p "$project" -f docker-compose.production.yml down --volumes --remove-orphans
          fi
